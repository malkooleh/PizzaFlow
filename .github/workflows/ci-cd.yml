name: PizzaFlow CI/CD Pipeline

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

env:
  JAVA_VERSION: '21'
  MAVEN_VERSION: '3.9'

jobs:
  # Build and Test
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Build with Maven
        run: mvn clean install -DskipTests
      
      - name: Run Unit Tests
        run: mvn test
      
      - name: Run Integration Tests
        run: mvn verify -Pintegration-tests
        env:
          TESTCONTAINERS_RYUK_DISABLED: false
      
      - name: Generate Test Coverage Report
        run: mvn jacoco:report
      
      - name: Upload Test Coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-pizzaflow
      
      - name: Archive artifacts
        uses: actions/upload-artifact@v3
        with:
          name: maven-artifacts
          path: |
            **/target/*.jar
          retention-days: 5

  # Code Quality Analysis
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      - name: SonarQube Scan
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=pizzaflow \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Docker Build & Push
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'
    outputs:
      image-tag: ${{ steps.image-tag.outputs.tag }}

    strategy:
      matrix:
        service:
          - discovery-service
          - config-service
          - api-gateway
          - catalog-service
          - order-service
          - payment-service
          - kitchen-service
          - inventory-service
          - booking-service
          - delivery-service
          - notification-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image tag
        id: image-tag
        run: echo "tag=${{ github.ref_name }}-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: pizzaflow/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Security Scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Release Guardrails (P1 hardening gates)
  release-guardrails:
    name: Release Guardrails
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Policy check - block latest tags in deploy manifests
        run: |
          if git grep -nE '(:latest|newTag:[[:space:]]*latest|\btag:[[:space:]]*latest\b)' -- infrastructure ':!**/README.md'; then
            echo "Found mutable image tags in deployment manifests. Use immutable tags only."
            exit 1
          fi

      - name: Policy check - block placeholder secrets in production inputs
        run: |
          if git grep -n 'CHANGE_ME_' -- infrastructure/kubernetes/overlays/production infrastructure/helm/pizzaflow/values-production.yaml; then
            echo "Found placeholder secrets in production-scoped files."
            exit 1
          fi

      - name: Helm lint
        run: |
          helm lint ./infrastructure/helm/pizzaflow

      - name: Helm render validation
        run: |
          helm template pizzaflow ./infrastructure/helm/pizzaflow \
            --namespace pizzaflow-prod \
            --set global.environment=prod \
            --set global.imageRegistry=pizzaflow/ \
            --set global.imageTag=sha-validate \
            --values ./infrastructure/helm/pizzaflow/values-production.yaml > /tmp/pizzaflow-helm-render.yaml

      - name: Kustomize render validation (all overlays)
        run: |
          kubectl kustomize infrastructure/kubernetes/overlays/dev > /tmp/pizzaflow-kustomize-dev.yaml
          kubectl kustomize infrastructure/kubernetes/overlays/staging > /tmp/pizzaflow-kustomize-staging.yaml
          kubectl kustomize infrastructure/kubernetes/overlays/production > /tmp/pizzaflow-kustomize-production.yaml

  # Deploy to Development
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [docker, security, release-guardrails]
    if: github.ref == 'refs/heads/develop'
    environment: development
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > ~/.kube/config
      
      - name: Deploy with Kustomize
        run: |
          kubectl apply -k infrastructure/kubernetes/overlays/dev
      
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment -n pizzaflow-dev --timeout=300s
      
      - name: Run smoke tests
        run: |
          # Wait for services to be ready
          sleep 30
          # Get gateway URL and run basic health checks
          GATEWAY_URL=$(kubectl get svc -n pizzaflow-dev dev-api-gateway -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl -f http://${GATEWAY_URL}:8080/actuator/health || exit 1

  # Deploy to Staging
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker, security, release-guardrails]
    if: github.ref == 'refs/heads/master'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
      
      - name: Deploy with Kustomize
        run: |
          cd infrastructure/kubernetes/overlays/staging
          IMAGE_TAG=${{ needs.docker.outputs.image-tag }}
          SERVICES="discovery-service config-service api-gateway catalog-service order-service payment-service kitchen-service inventory-service booking-service delivery-service notification-service"
          for svc in $SERVICES; do
            kustomize edit set image pizzaflow/${svc}=pizzaflow/${svc}:${IMAGE_TAG}
          done
          kubectl apply -k .
      
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment -n pizzaflow-staging --timeout=300s
      
      - name: Run integration tests
        run: |
          sleep 30
          GATEWAY_URL=$(kubectl get svc -n pizzaflow-staging staging-api-gateway -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          # Run API tests against staging
          npm install -g newman
          newman run api-tests/pizzaflow-collection.json --env-var "baseUrl=http://${GATEWAY_URL}:8080"

  # Deploy to Production (Manual Approval Required)
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker, deploy-staging, release-guardrails]
    if: github.ref == 'refs/heads/master'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
      
      - name: Deploy with Helm
        run: |
          IMAGE_TAG=${{ needs.docker.outputs.image-tag }}
          helm upgrade --install pizzaflow ./infrastructure/helm/pizzaflow \
            --namespace pizzaflow-prod \
            --create-namespace \
            --set global.environment=prod \
            --set global.imageRegistry=${{ secrets.DOCKER_REGISTRY }}/ \
            --set global.imageTag=${IMAGE_TAG} \
            --set autoscaling.enabled=true \
            --set podDisruptionBudget.enabled=true \
            --set networkPolicy.enabled=true \
            --values ./infrastructure/helm/pizzaflow/values-production.yaml \
            --wait \
            --timeout 10m
      
      - name: Verify deployment
        run: |
          kubectl get pods -n pizzaflow-prod
          kubectl get services -n pizzaflow-prod
      
      - name: Run production smoke tests
        run: |
          GATEWAY_URL=$(kubectl get svc -n pizzaflow-prod pizzaflow-api-gateway -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          curl -f http://${GATEWAY_URL}:8080/actuator/health || exit 1

  # Rollback Job (Manual Trigger)
  rollback:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'v3.13.0'
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'
      
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
      
      - name: Rollback Helm release
        run: |
          helm rollback pizzaflow -n pizzaflow-prod
      
      - name: Verify rollback
        run: |
          kubectl rollout status deployment -n pizzaflow-prod --timeout=300s
