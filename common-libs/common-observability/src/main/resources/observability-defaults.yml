# Common Observability Configuration
# Include this in your service's application.yml

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,loggers,env,beans,mappings,threaddump,heapdump
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${spring.profiles.active:default}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s,5s
    enable:
      jvm: true
      system: true
      process: true
      logback: true
      tomcat: true
      kafka: true
  tracing:
    sampling:
      probability: 1.0  # Sample 100% in dev/staging, reduce in production
    propagation:
      type: w3c,b3

# Zipkin Configuration
spring:
  zipkin:
    base-url: http://localhost:9411
    enabled: true
  sleuth:
    sampler:
      probability: 1.0

# Alternative: OpenTelemetry Configuration
# Uncomment to use OTLP instead of Zipkin
# otel:
#   exporter:
#     otlp:
#       endpoint: http://localhost:4317
#   resource:
#     attributes:
#       service.name: ${spring.application.name}
#       service.namespace: pizza-flow
#       deployment.environment: ${spring.profiles.active:default}

# Logging
logging:
  level:
    root: INFO
    com.pizzaflow: INFO
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId},%X{spanId}] %-5level %logger{36} - %msg%n"
