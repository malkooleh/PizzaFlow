# Spring Cloud Configuration
spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
        alphanumeric-ids:
          enabled: true
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 5000
            logger-level: basic

# Management Endpoints for Resilience4j
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,ratelimiters,retries,bulkheads,timelimiters
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
