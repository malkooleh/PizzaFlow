syntax = "proto3";

package com.pizzaflow.grpc.common;

option java_package = "com.pizzaflow.grpc.common";
option java_outer_classname = "CommonProtos";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";

// Common types used across all services

message Money {
  int64 amount_micros = 1;  // Amount in micros (1/1,000,000 of currency unit)
  string currency_code = 2; // ISO 4217 currency code (e.g., "USD", "EUR")
}

message Address {
  string street = 1;
  string city = 2;
  string state = 3;
  string postal_code = 4;
  string country = 5;
  double latitude = 6;
  double longitude = 7;
}

message PageRequest {
  int32 page = 1;
  int32 size = 2;
  string sort_by = 3;
  SortDirection sort_direction = 4;
}

enum SortDirection {
  ASC = 0;
  DESC = 1;
}

message PageResponse {
  int32 page = 1;
  int32 size = 2;
  int64 total_elements = 3;
  int32 total_pages = 4;
  bool has_next = 5;
  bool has_previous = 6;
}

message ErrorResponse {
  string code = 1;
  string message = 2;
  repeated FieldError field_errors = 3;
  google.protobuf.Timestamp timestamp = 4;
}

message FieldError {
  string field = 1;
  string message = 2;
}

// Health check types
message HealthCheckRequest {
  string service = 1;
}

message HealthCheckResponse {
  ServingStatus status = 1;
}

enum ServingStatus {
  UNKNOWN = 0;
  SERVING = 1;
  NOT_SERVING = 2;
  SERVICE_UNKNOWN = 3;
}
