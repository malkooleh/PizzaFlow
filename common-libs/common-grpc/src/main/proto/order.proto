syntax = "proto3";

package com.pizzaflow.grpc.order;

option java_package = "com.pizzaflow.grpc.order";
option java_outer_classname = "OrderServiceProtos";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "common.proto";

// Order Service - Order Management

service OrderService {
  // Order CRUD
  rpc CreateOrder(CreateOrderRequest) returns (Order);
  rpc GetOrder(GetOrderRequest) returns (Order);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc UpdateOrderStatus(UpdateOrderStatusRequest) returns (Order);
  rpc CancelOrder(CancelOrderRequest) returns (Order);
  
  // Order Items
  rpc AddOrderItem(AddOrderItemRequest) returns (Order);
  rpc RemoveOrderItem(RemoveOrderItemRequest) returns (Order);
  rpc UpdateOrderItem(UpdateOrderItemRequest) returns (Order);
  
  // Order Tracking
  rpc GetOrderStatus(GetOrderStatusRequest) returns (OrderStatusResponse);
  rpc StreamOrderUpdates(StreamOrderUpdatesRequest) returns (stream OrderUpdate);
  
  // Customer Orders
  rpc GetCustomerOrders(GetCustomerOrdersRequest) returns (ListOrdersResponse);
  
  // Restaurant Orders
  rpc GetRestaurantOrders(GetRestaurantOrdersRequest) returns (ListOrdersResponse);
  rpc GetKitchenQueue(GetKitchenQueueRequest) returns (KitchenQueueResponse);
}

// Order Messages
message Order {
  string id = 1;
  string customer_id = 2;
  string restaurant_id = 3;
  OrderStatus status = 4;
  OrderType type = 5;
  repeated OrderItem items = 6;
  com.pizzaflow.grpc.common.Money subtotal = 7;
  com.pizzaflow.grpc.common.Money tax = 8;
  com.pizzaflow.grpc.common.Money delivery_fee = 9;
  com.pizzaflow.grpc.common.Money discount = 10;
  com.pizzaflow.grpc.common.Money total = 11;
  string payment_id = 12;
  PaymentStatus payment_status = 13;
  com.pizzaflow.grpc.common.Address delivery_address = 14;
  string special_instructions = 15;
  google.protobuf.Timestamp scheduled_for = 16;
  int32 estimated_preparation_minutes = 17;
  google.protobuf.Timestamp created_at = 18;
  google.protobuf.Timestamp updated_at = 19;
  repeated OrderStatusHistory status_history = 20;
}

enum OrderStatus {
  ORDER_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  CONFIRMED = 2;
  PREPARING = 3;
  READY = 4;
  OUT_FOR_DELIVERY = 5;
  DELIVERED = 6;
  COMPLETED = 7;
  CANCELLED = 8;
  REFUNDED = 9;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  DINE_IN = 1;
  TAKEOUT = 2;
  DELIVERY = 3;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  PAYMENT_PENDING = 1;
  PAYMENT_COMPLETED = 2;
  PAYMENT_FAILED = 3;
  PAYMENT_REFUNDED = 4;
}

message OrderItem {
  string id = 1;
  string menu_item_id = 2;
  string menu_item_name = 3;
  int32 quantity = 4;
  com.pizzaflow.grpc.common.Money unit_price = 5;
  com.pizzaflow.grpc.common.Money total_price = 6;
  repeated ItemModifier modifiers = 7;
  string special_instructions = 8;
}

message ItemModifier {
  string id = 1;
  string name = 2;
  com.pizzaflow.grpc.common.Money price_adjustment = 3;
}

message OrderStatusHistory {
  OrderStatus status = 1;
  google.protobuf.Timestamp timestamp = 2;
  string notes = 3;
  string updated_by = 4;
}

// Request/Response Messages
message CreateOrderRequest {
  string customer_id = 1;
  string restaurant_id = 2;
  OrderType type = 3;
  repeated CreateOrderItem items = 4;
  com.pizzaflow.grpc.common.Address delivery_address = 5;
  string special_instructions = 6;
  google.protobuf.Timestamp scheduled_for = 7;
  string promo_code = 8;
}

message CreateOrderItem {
  string menu_item_id = 1;
  int32 quantity = 2;
  repeated string modifier_ids = 3;
  string special_instructions = 4;
}

message GetOrderRequest {
  string order_id = 1;
}

message ListOrdersRequest {
  OrderStatus status = 1;
  OrderType type = 2;
  google.protobuf.Timestamp from_date = 3;
  google.protobuf.Timestamp to_date = 4;
  com.pizzaflow.grpc.common.PageRequest pagination = 5;
}

message ListOrdersResponse {
  repeated Order orders = 1;
  com.pizzaflow.grpc.common.PageResponse pagination = 2;
}

message UpdateOrderStatusRequest {
  string order_id = 1;
  OrderStatus status = 2;
  string notes = 3;
  string updated_by = 4;
}

message CancelOrderRequest {
  string order_id = 1;
  string reason = 2;
  string cancelled_by = 3;
}

message AddOrderItemRequest {
  string order_id = 1;
  CreateOrderItem item = 2;
}

message RemoveOrderItemRequest {
  string order_id = 1;
  string item_id = 2;
}

message UpdateOrderItemRequest {
  string order_id = 1;
  string item_id = 2;
  optional int32 quantity = 3;
  repeated string modifier_ids = 4;
  optional string special_instructions = 5;
}

message GetOrderStatusRequest {
  string order_id = 1;
}

message OrderStatusResponse {
  string order_id = 1;
  OrderStatus status = 2;
  int32 estimated_minutes_remaining = 3;
  string status_message = 4;
  google.protobuf.Timestamp last_updated = 5;
}

message StreamOrderUpdatesRequest {
  string order_id = 1;
}

message OrderUpdate {
  string order_id = 1;
  OrderStatus previous_status = 2;
  OrderStatus current_status = 3;
  string message = 4;
  google.protobuf.Timestamp timestamp = 5;
}

message GetCustomerOrdersRequest {
  string customer_id = 1;
  OrderStatus status = 2;
  com.pizzaflow.grpc.common.PageRequest pagination = 3;
}

message GetRestaurantOrdersRequest {
  string restaurant_id = 1;
  OrderStatus status = 2;
  google.protobuf.Timestamp from_date = 3;
  google.protobuf.Timestamp to_date = 4;
  com.pizzaflow.grpc.common.PageRequest pagination = 5;
}

message GetKitchenQueueRequest {
  string restaurant_id = 1;
}

message KitchenQueueResponse {
  repeated KitchenOrder orders = 1;
  int32 total_pending = 2;
  int32 average_wait_minutes = 3;
}

message KitchenOrder {
  string order_id = 1;
  OrderStatus status = 2;
  repeated OrderItem items = 3;
  int32 priority = 4;
  int32 wait_time_minutes = 5;
  google.protobuf.Timestamp order_time = 6;
}
