syntax = "proto3";

package com.pizzaflow.grpc.payment;

option java_package = "com.pizzaflow.grpc.payment";
option java_outer_classname = "PaymentServiceProtos";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "common.proto";

// Payment Service - Payment Processing

service PaymentService {
  // Payment Operations
  rpc ProcessPayment(ProcessPaymentRequest) returns (PaymentResponse);
  rpc GetPayment(GetPaymentRequest) returns (Payment);
  rpc GetPaymentByOrderId(GetPaymentByOrderIdRequest) returns (Payment);
  
  // Refunds
  rpc RefundPayment(RefundPaymentRequest) returns (RefundResponse);
  rpc GetRefund(GetRefundRequest) returns (Refund);
  
  // Payment Methods
  rpc GetSavedPaymentMethods(GetSavedPaymentMethodsRequest) returns (SavedPaymentMethodsResponse);
  rpc SavePaymentMethod(SavePaymentMethodRequest) returns (SavedPaymentMethod);
  rpc DeletePaymentMethod(DeletePaymentMethodRequest) returns (google.protobuf.Empty);
  
  // Payment Status
  rpc GetPaymentStatus(GetPaymentStatusRequest) returns (PaymentStatusResponse);
}

// Payment Messages
message Payment {
  string id = 1;
  string order_id = 2;
  string customer_id = 3;
  com.pizzaflow.grpc.common.Money amount = 4;
  PaymentMethod method = 5;
  PaymentStatus status = 6;
  string processor_transaction_id = 7;
  string processor_response_code = 8;
  string processor_message = 9;
  PaymentMetadata metadata = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp processed_at = 12;
  repeated Refund refunds = 13;
}

enum PaymentMethod {
  PAYMENT_METHOD_UNSPECIFIED = 0;
  CREDIT_CARD = 1;
  DEBIT_CARD = 2;
  DIGITAL_WALLET = 3;
  CASH = 4;
  GIFT_CARD = 5;
  LOYALTY_POINTS = 6;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNSPECIFIED = 0;
  INITIATED = 1;
  PENDING = 2;
  AUTHORIZED = 3;
  CAPTURED = 4;
  COMPLETED = 5;
  FAILED = 6;
  CANCELLED = 7;
  REFUNDED = 8;
  PARTIALLY_REFUNDED = 9;
}

message PaymentMetadata {
  string card_last_four = 1;
  string card_brand = 2;
  string card_expiry = 3;
  string wallet_type = 4;
  string billing_postal_code = 5;
  string ip_address = 6;
  string device_fingerprint = 7;
}

message Refund {
  string id = 1;
  string payment_id = 2;
  com.pizzaflow.grpc.common.Money amount = 3;
  RefundStatus status = 4;
  string reason = 5;
  string processor_refund_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp processed_at = 8;
}

enum RefundStatus {
  REFUND_STATUS_UNSPECIFIED = 0;
  REFUND_PENDING = 1;
  REFUND_PROCESSING = 2;
  REFUND_COMPLETED = 3;
  REFUND_FAILED = 4;
}

// Request/Response Messages
message ProcessPaymentRequest {
  string order_id = 1;
  string customer_id = 2;
  com.pizzaflow.grpc.common.Money amount = 3;
  PaymentMethod method = 4;
  PaymentDetails payment_details = 5;
  string idempotency_key = 6;
  PaymentMetadata metadata = 7;
}

message PaymentDetails {
  oneof details {
    CardDetails card = 1;
    WalletDetails wallet = 2;
    GiftCardDetails gift_card = 3;
  }
}

message CardDetails {
  string number = 1;
  string expiry_month = 2;
  string expiry_year = 3;
  string cvv = 4;
  string cardholder_name = 5;
  string billing_postal_code = 6;
  bool save_card = 7;
}

message WalletDetails {
  string wallet_type = 1;  // "APPLE_PAY", "GOOGLE_PAY", etc.
  string token = 2;
}

message GiftCardDetails {
  string card_number = 1;
  string pin = 2;
}

message PaymentResponse {
  Payment payment = 1;
  bool success = 2;
  string message = 3;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message GetPaymentByOrderIdRequest {
  string order_id = 1;
}

message RefundPaymentRequest {
  string payment_id = 1;
  com.pizzaflow.grpc.common.Money amount = 2;  // Optional: omit for full refund
  string reason = 3;
  string idempotency_key = 4;
}

message RefundResponse {
  Refund refund = 1;
  bool success = 2;
  string message = 3;
}

message GetRefundRequest {
  string refund_id = 1;
}

// Saved Payment Methods
message SavedPaymentMethod {
  string id = 1;
  string customer_id = 2;
  PaymentMethod type = 3;
  string display_name = 4;
  string card_last_four = 5;
  string card_brand = 6;
  string card_expiry = 7;
  bool is_default = 8;
  google.protobuf.Timestamp created_at = 9;
}

message GetSavedPaymentMethodsRequest {
  string customer_id = 1;
}

message SavedPaymentMethodsResponse {
  repeated SavedPaymentMethod methods = 1;
}

message SavePaymentMethodRequest {
  string customer_id = 1;
  PaymentDetails details = 2;
  bool set_as_default = 3;
}

message DeletePaymentMethodRequest {
  string payment_method_id = 1;
}

message GetPaymentStatusRequest {
  string payment_id = 1;
}

message PaymentStatusResponse {
  string payment_id = 1;
  PaymentStatus status = 2;
  string message = 3;
  google.protobuf.Timestamp last_updated = 4;
}
