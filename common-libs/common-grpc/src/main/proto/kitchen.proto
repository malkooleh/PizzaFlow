syntax = "proto3";

package com.pizzaflow.grpc.kitchen;

option java_package = "com.pizzaflow.grpc.kitchen";
option java_outer_classname = "KitchenServiceProtos";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "common.proto";

// Kitchen Service - Kitchen Display System & Order Preparation

service KitchenService {
  // Kitchen Tickets
  rpc CreateTicket(CreateTicketRequest) returns (KitchenTicket);
  rpc GetTicket(GetTicketRequest) returns (KitchenTicket);
  rpc UpdateTicketStatus(UpdateTicketStatusRequest) returns (KitchenTicket);
  rpc CancelTicket(CancelTicketRequest) returns (KitchenTicket);
  
  // Kitchen Queue
  rpc GetKitchenQueue(GetKitchenQueueRequest) returns (KitchenQueueResponse);
  rpc StreamKitchenUpdates(StreamKitchenUpdatesRequest) returns (stream KitchenUpdate);
  
  // Item Preparation
  rpc StartItemPreparation(StartItemPreparationRequest) returns (TicketItem);
  rpc CompleteItemPreparation(CompleteItemPreparationRequest) returns (TicketItem);
  
  // Station Management
  rpc GetStationTickets(GetStationTicketsRequest) returns (StationTicketsResponse);
  rpc AssignTicketToStation(AssignTicketToStationRequest) returns (KitchenTicket);
  
  // Metrics
  rpc GetKitchenMetrics(GetKitchenMetricsRequest) returns (KitchenMetrics);
}

// Kitchen Ticket Messages
message KitchenTicket {
  string id = 1;
  string order_id = 2;
  string restaurant_id = 3;
  TicketStatus status = 4;
  TicketPriority priority = 5;
  repeated TicketItem items = 6;
  string assigned_station = 7;
  string assigned_chef = 8;
  int32 estimated_prep_minutes = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp completed_at = 12;
  string special_instructions = 13;
  repeated TicketStatusHistory status_history = 14;
}

enum TicketStatus {
  TICKET_STATUS_UNSPECIFIED = 0;
  TICKET_PENDING = 1;
  TICKET_QUEUED = 2;
  TICKET_IN_PROGRESS = 3;
  TICKET_READY = 4;
  TICKET_SERVED = 5;
  TICKET_CANCELLED = 6;
}

enum TicketPriority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_NORMAL = 1;
  PRIORITY_HIGH = 2;
  PRIORITY_RUSH = 3;
  PRIORITY_VIP = 4;
}

message TicketItem {
  string id = 1;
  string menu_item_id = 2;
  string menu_item_name = 3;
  int32 quantity = 4;
  ItemPrepStatus prep_status = 5;
  repeated string modifiers = 6;
  string special_instructions = 7;
  string station = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp completed_at = 10;
}

enum ItemPrepStatus {
  ITEM_PREP_STATUS_UNSPECIFIED = 0;
  ITEM_WAITING = 1;
  ITEM_PREPARING = 2;
  ITEM_READY = 3;
  ITEM_BUMPED = 4;  // Added to completed order
}

message TicketStatusHistory {
  TicketStatus status = 1;
  google.protobuf.Timestamp timestamp = 2;
  string updated_by = 3;
  string notes = 4;
}

// Request/Response Messages
message CreateTicketRequest {
  string order_id = 1;
  string restaurant_id = 2;
  repeated CreateTicketItem items = 3;
  TicketPriority priority = 4;
  string special_instructions = 5;
}

message CreateTicketItem {
  string menu_item_id = 1;
  string menu_item_name = 2;
  int32 quantity = 3;
  repeated string modifiers = 4;
  string special_instructions = 5;
}

message GetTicketRequest {
  string ticket_id = 1;
}

message UpdateTicketStatusRequest {
  string ticket_id = 1;
  TicketStatus status = 2;
  string updated_by = 3;
  string notes = 4;
}

message CancelTicketRequest {
  string ticket_id = 1;
  string reason = 2;
  string cancelled_by = 3;
}

message GetKitchenQueueRequest {
  string restaurant_id = 1;
  TicketStatus status = 2;
  string station = 3;
}

message KitchenQueueResponse {
  repeated KitchenTicket tickets = 1;
  QueueStats stats = 2;
}

message QueueStats {
  int32 total_tickets = 1;
  int32 pending_tickets = 2;
  int32 in_progress_tickets = 3;
  int32 ready_tickets = 4;
  int32 average_wait_seconds = 5;
  int32 average_prep_seconds = 6;
}

message StreamKitchenUpdatesRequest {
  string restaurant_id = 1;
  string station = 2;
}

message KitchenUpdate {
  UpdateType type = 1;
  KitchenTicket ticket = 2;
  google.protobuf.Timestamp timestamp = 3;
}

enum UpdateType {
  UPDATE_TYPE_UNSPECIFIED = 0;
  NEW_TICKET = 1;
  STATUS_CHANGED = 2;
  ITEM_UPDATED = 3;
  TICKET_CANCELLED = 4;
  TICKET_PRIORITY_CHANGED = 5;
}

message StartItemPreparationRequest {
  string ticket_id = 1;
  string item_id = 2;
  string chef_id = 3;
}

message CompleteItemPreparationRequest {
  string ticket_id = 1;
  string item_id = 2;
  string chef_id = 3;
}

// Station Management
message GetStationTicketsRequest {
  string restaurant_id = 1;
  string station = 2;
}

message StationTicketsResponse {
  string station = 1;
  repeated KitchenTicket tickets = 2;
  int32 active_count = 3;
}

message AssignTicketToStationRequest {
  string ticket_id = 1;
  string station = 2;
  string assigned_by = 3;
}

// Metrics
message GetKitchenMetricsRequest {
  string restaurant_id = 1;
  google.protobuf.Timestamp from_date = 2;
  google.protobuf.Timestamp to_date = 3;
}

message KitchenMetrics {
  int32 total_tickets_processed = 1;
  double average_prep_time_seconds = 2;
  double average_wait_time_seconds = 3;
  int32 tickets_on_time = 4;
  int32 tickets_delayed = 5;
  double on_time_percentage = 6;
  repeated StationMetrics station_metrics = 7;
  repeated HourlyMetrics hourly_breakdown = 8;
}

message StationMetrics {
  string station = 1;
  int32 tickets_processed = 2;
  double average_prep_time_seconds = 3;
}

message HourlyMetrics {
  int32 hour = 1;
  int32 tickets_count = 2;
  double average_prep_time_seconds = 3;
}
