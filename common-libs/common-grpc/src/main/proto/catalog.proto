syntax = "proto3";

package com.pizzaflow.grpc.catalog;

option java_package = "com.pizzaflow.grpc.catalog";
option java_outer_classname = "CatalogServiceProtos";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "common.proto";

// Catalog Service - Menu Items and Categories

service CatalogService {
  // Menu Items
  rpc GetMenuItem(GetMenuItemRequest) returns (MenuItem);
  rpc ListMenuItems(ListMenuItemsRequest) returns (ListMenuItemsResponse);
  rpc CreateMenuItem(CreateMenuItemRequest) returns (MenuItem);
  rpc UpdateMenuItem(UpdateMenuItemRequest) returns (MenuItem);
  rpc DeleteMenuItem(DeleteMenuItemRequest) returns (google.protobuf.Empty);
  
  // Categories
  rpc GetCategory(GetCategoryRequest) returns (Category);
  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse);
  
  // Restaurant specific
  rpc GetRestaurantMenu(GetRestaurantMenuRequest) returns (RestaurantMenu);
  
  // Validation
  rpc ValidateMenuItems(ValidateMenuItemsRequest) returns (ValidateMenuItemsResponse);
}

// Menu Item Messages
message MenuItem {
  string id = 1;
  string restaurant_id = 2;
  string name = 3;
  string description = 4;
  com.pizzaflow.grpc.common.Money price = 5;
  string category_id = 6;
  bool available = 7;
  repeated string ingredient_ids = 8;
  repeated string allergens = 9;
  int32 preparation_time_minutes = 10;
  string image_url = 11;
  NutritionalInfo nutritional_info = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
}

message NutritionalInfo {
  int32 calories = 1;
  double protein_grams = 2;
  double carbs_grams = 3;
  double fat_grams = 4;
  double fiber_grams = 5;
  double sodium_mg = 6;
}

message GetMenuItemRequest {
  string menu_item_id = 1;
}

message ListMenuItemsRequest {
  string restaurant_id = 1;
  string category_id = 2;
  bool available_only = 3;
  com.pizzaflow.grpc.common.PageRequest pagination = 4;
}

message ListMenuItemsResponse {
  repeated MenuItem items = 1;
  com.pizzaflow.grpc.common.PageResponse pagination = 2;
}

message CreateMenuItemRequest {
  string restaurant_id = 1;
  string name = 2;
  string description = 3;
  com.pizzaflow.grpc.common.Money price = 4;
  string category_id = 5;
  repeated string ingredient_ids = 6;
  repeated string allergens = 7;
  int32 preparation_time_minutes = 8;
  string image_url = 9;
  NutritionalInfo nutritional_info = 10;
}

message UpdateMenuItemRequest {
  string menu_item_id = 1;
  optional string name = 2;
  optional string description = 3;
  optional com.pizzaflow.grpc.common.Money price = 4;
  optional string category_id = 5;
  optional bool available = 6;
  repeated string ingredient_ids = 7;
  repeated string allergens = 8;
  optional int32 preparation_time_minutes = 9;
  optional string image_url = 10;
  optional NutritionalInfo nutritional_info = 11;
}

message DeleteMenuItemRequest {
  string menu_item_id = 1;
}

// Category Messages
message Category {
  string id = 1;
  string name = 2;
  string description = 3;
  string image_url = 4;
  int32 display_order = 5;
  bool active = 6;
}

message GetCategoryRequest {
  string category_id = 1;
}

message ListCategoriesRequest {
  bool active_only = 1;
}

message ListCategoriesResponse {
  repeated Category categories = 1;
}

// Restaurant Menu
message GetRestaurantMenuRequest {
  string restaurant_id = 1;
}

message RestaurantMenu {
  string restaurant_id = 1;
  string restaurant_name = 2;
  repeated MenuCategory categories = 3;
}

message MenuCategory {
  Category category = 1;
  repeated MenuItem items = 2;
}

// Validation
message ValidateMenuItemsRequest {
  repeated string menu_item_ids = 1;
  string restaurant_id = 2;
}

message ValidateMenuItemsResponse {
  bool valid = 1;
  repeated InvalidItem invalid_items = 2;
}

message InvalidItem {
  string menu_item_id = 1;
  string reason = 2;
}
