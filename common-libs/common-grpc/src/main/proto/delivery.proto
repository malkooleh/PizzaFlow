syntax = "proto3";

package com.pizzaflow.grpc.delivery;

option java_package = "com.pizzaflow.grpc.delivery";
option java_outer_classname = "DeliveryServiceProtos";
option java_multiple_files = true;

import "google/protobuf/timestamp.proto";
import "google/protobuf/empty.proto";
import "common.proto";

// Delivery Service - Delivery Tracking & Driver Management

service DeliveryService {
  // Delivery Operations
  rpc CreateDelivery(CreateDeliveryRequest) returns (Delivery);
  rpc GetDelivery(GetDeliveryRequest) returns (Delivery);
  rpc GetDeliveryByOrderId(GetDeliveryByOrderIdRequest) returns (Delivery);
  rpc UpdateDeliveryStatus(UpdateDeliveryStatusRequest) returns (Delivery);
  rpc CancelDelivery(CancelDeliveryRequest) returns (Delivery);
  
  // Driver Assignment
  rpc AssignDriver(AssignDriverRequest) returns (Delivery);
  rpc UnassignDriver(UnassignDriverRequest) returns (Delivery);
  
  // Location Tracking
  rpc UpdateDriverLocation(UpdateDriverLocationRequest) returns (google.protobuf.Empty);
  rpc GetDriverLocation(GetDriverLocationRequest) returns (DriverLocation);
  rpc StreamDeliveryLocation(StreamDeliveryLocationRequest) returns (stream LocationUpdate);
  
  // Driver Management
  rpc GetAvailableDrivers(GetAvailableDriversRequest) returns (AvailableDriversResponse);
  rpc GetDriverDeliveries(GetDriverDeliveriesRequest) returns (DriverDeliveriesResponse);
  
  // ETA Calculation
  rpc CalculateETA(CalculateETARequest) returns (ETAResponse);
  
  // Delivery Zones
  rpc GetDeliveryZones(GetDeliveryZonesRequest) returns (DeliveryZonesResponse);
  rpc CheckDeliveryAvailability(CheckDeliveryAvailabilityRequest) returns (DeliveryAvailabilityResponse);
}

// Delivery Messages
message Delivery {
  string id = 1;
  string order_id = 2;
  string restaurant_id = 3;
  string customer_id = 4;
  DeliveryStatus status = 5;
  Driver assigned_driver = 6;
  com.pizzaflow.grpc.common.Address pickup_address = 7;
  com.pizzaflow.grpc.common.Address delivery_address = 8;
  com.pizzaflow.grpc.common.Money delivery_fee = 9;
  double distance_km = 10;
  int32 estimated_minutes = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp picked_up_at = 13;
  google.protobuf.Timestamp delivered_at = 14;
  string delivery_instructions = 15;
  repeated DeliveryStatusHistory status_history = 16;
  DeliveryRating rating = 17;
}

enum DeliveryStatus {
  DELIVERY_STATUS_UNSPECIFIED = 0;
  DELIVERY_PENDING = 1;
  DRIVER_ASSIGNED = 2;
  DRIVER_EN_ROUTE_PICKUP = 3;
  PICKED_UP = 4;
  IN_TRANSIT = 5;
  ARRIVED = 6;
  DELIVERED = 7;
  DELIVERY_FAILED = 8;
  DELIVERY_CANCELLED = 9;
}

message Driver {
  string id = 1;
  string name = 2;
  string phone = 3;
  string photo_url = 4;
  string vehicle_type = 5;
  string vehicle_license = 6;
  double rating = 7;
  int32 total_deliveries = 8;
}

message DeliveryStatusHistory {
  DeliveryStatus status = 1;
  google.protobuf.Timestamp timestamp = 2;
  string notes = 3;
  DriverLocation location = 4;
}

message DeliveryRating {
  int32 stars = 1;  // 1-5
  string comment = 2;
  google.protobuf.Timestamp rated_at = 3;
}

message DriverLocation {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  double heading = 4;  // degrees from north
  double speed_kmh = 5;
  google.protobuf.Timestamp timestamp = 6;
}

// Request/Response Messages
message CreateDeliveryRequest {
  string order_id = 1;
  string restaurant_id = 2;
  string customer_id = 3;
  com.pizzaflow.grpc.common.Address pickup_address = 4;
  com.pizzaflow.grpc.common.Address delivery_address = 5;
  string delivery_instructions = 6;
  google.protobuf.Timestamp requested_pickup_time = 7;
}

message GetDeliveryRequest {
  string delivery_id = 1;
}

message GetDeliveryByOrderIdRequest {
  string order_id = 1;
}

message UpdateDeliveryStatusRequest {
  string delivery_id = 1;
  DeliveryStatus status = 2;
  string notes = 3;
  DriverLocation location = 4;
}

message CancelDeliveryRequest {
  string delivery_id = 1;
  string reason = 2;
  string cancelled_by = 3;
}

message AssignDriverRequest {
  string delivery_id = 1;
  string driver_id = 2;
}

message UnassignDriverRequest {
  string delivery_id = 1;
  string reason = 2;
}

message UpdateDriverLocationRequest {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  double heading = 4;
  double speed_kmh = 5;
}

message GetDriverLocationRequest {
  string driver_id = 1;
}

message StreamDeliveryLocationRequest {
  string delivery_id = 1;
}

message LocationUpdate {
  string delivery_id = 1;
  DriverLocation location = 2;
  int32 eta_minutes = 3;
  double distance_remaining_km = 4;
}

message GetAvailableDriversRequest {
  string restaurant_id = 1;
  double latitude = 2;
  double longitude = 3;
  double radius_km = 4;
}

message AvailableDriversResponse {
  repeated AvailableDriver drivers = 1;
}

message AvailableDriver {
  Driver driver = 1;
  double distance_km = 2;
  int32 eta_minutes = 3;
  int32 active_deliveries = 4;
}

message GetDriverDeliveriesRequest {
  string driver_id = 1;
  DeliveryStatus status = 2;
  google.protobuf.Timestamp from_date = 3;
  google.protobuf.Timestamp to_date = 4;
}

message DriverDeliveriesResponse {
  repeated Delivery deliveries = 1;
  DriverStats stats = 2;
}

message DriverStats {
  int32 total_deliveries = 1;
  int32 completed_today = 2;
  double average_rating = 3;
  double total_distance_km = 4;
  com.pizzaflow.grpc.common.Money total_earnings = 5;
}

message CalculateETARequest {
  double origin_latitude = 1;
  double origin_longitude = 2;
  double destination_latitude = 3;
  double destination_longitude = 4;
}

message ETAResponse {
  int32 estimated_minutes = 1;
  double distance_km = 2;
  string route_polyline = 3;  // Encoded polyline
}

message GetDeliveryZonesRequest {
  string restaurant_id = 1;
}

message DeliveryZonesResponse {
  repeated DeliveryZone zones = 1;
}

message DeliveryZone {
  string id = 1;
  string name = 2;
  repeated Coordinate boundary = 3;
  com.pizzaflow.grpc.common.Money base_fee = 4;
  com.pizzaflow.grpc.common.Money per_km_fee = 5;
  int32 min_delivery_minutes = 6;
  int32 max_delivery_minutes = 7;
}

message Coordinate {
  double latitude = 1;
  double longitude = 2;
}

message CheckDeliveryAvailabilityRequest {
  string restaurant_id = 1;
  double latitude = 2;
  double longitude = 3;
}

message DeliveryAvailabilityResponse {
  bool available = 1;
  string zone_id = 2;
  com.pizzaflow.grpc.common.Money estimated_fee = 3;
  int32 estimated_minutes = 4;
  string message = 5;
}
