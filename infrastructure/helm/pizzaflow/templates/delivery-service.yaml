{{- if .Values.deliveryService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pizzaflow.fullname" . }}-delivery-service
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "pizzaflow.labels" . | nindent 4 }}
    app: delivery-service
    app.kubernetes.io/component: business
spec:
  replicas: {{ .Values.deliveryService.replicaCount }}
  selector:
    matchLabels:
      app: delivery-service
  template:
    metadata:
      labels:
        app: delivery-service
        app.kubernetes.io/component: business
        {{- include "pizzaflow.selectorLabels" . | nindent 8 }}
      annotations:
        {{- include "pizzaflow.prometheusAnnotations" (dict "port" .Values.deliveryService.service.port) | nindent 8 }}
    spec:
      {{- include "pizzaflow.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: delivery-service
          image: "{{ .Values.global.imageRegistry }}{{ .Values.deliveryService.image.repository }}:{{ .Values.deliveryService.image.tag }}"
          imagePullPolicy: {{ .Values.deliveryService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.deliveryService.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "pizzaflow.fullname" . }}-common-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/pizzaflow_delivery"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: postgres-password
            - name: SPRING_DATA_REDIS_HOST
              value: "{{ .Release.Name }}-redis-master"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-redis
                  key: redis-password
          resources:
            {{- toYaml .Values.deliveryService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.deliveryService.service.port }}
            initialDelaySeconds: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.deliveryService.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pizzaflow.fullname" . }}-delivery-service
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "pizzaflow.labels" . | nindent 4 }}
    app: delivery-service
spec:
  type: {{ .Values.deliveryService.service.type }}
  ports:
    - port: {{ .Values.deliveryService.service.port }}
      targetPort: {{ .Values.deliveryService.service.port }}
      protocol: TCP
      name: http
  selector:
    app: delivery-service
{{- end }}
