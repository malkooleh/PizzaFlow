{{- if .Values.catalogService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pizzaflow.fullname" . }}-catalog-service
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "pizzaflow.labels" . | nindent 4 }}
    app: catalog-service
    app.kubernetes.io/component: business
spec:
  replicas: {{ .Values.catalogService.replicaCount }}
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
        app.kubernetes.io/component: business
        {{- include "pizzaflow.selectorLabels" . | nindent 8 }}
      annotations:
        {{- include "pizzaflow.prometheusAnnotations" (dict "port" .Values.catalogService.service.port) | nindent 8 }}
    spec:
      {{- include "pizzaflow.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: catalog-service
          image: "{{ .Values.global.imageRegistry }}{{ .Values.catalogService.image.repository }}:{{ default .Values.catalogService.image.tag .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.catalogService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.catalogService.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "pizzaflow.fullname" . }}-common-config
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://{{ .Release.Name }}-mongodb:27017/pizzaflow_catalog"
            - name: SPRING_DATA_MONGODB_USERNAME
              value: "root"
            - name: SPRING_DATA_MONGODB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-mongodb
                  key: mongodb-root-password
          resources:
            {{- toYaml .Values.catalogService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.catalogService.service.port }}
            initialDelaySeconds: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.catalogService.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pizzaflow.fullname" . }}-catalog-service
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "pizzaflow.labels" . | nindent 4 }}
    app: catalog-service
spec:
  type: {{ .Values.catalogService.service.type }}
  ports:
    - port: {{ .Values.catalogService.service.port }}
      targetPort: {{ .Values.catalogService.service.port }}
      protocol: TCP
      name: http
  selector:
    app: catalog-service
{{- end }}
