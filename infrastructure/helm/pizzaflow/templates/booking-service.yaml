{{- if .Values.bookingService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pizzaflow.fullname" . }}-booking-service
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "pizzaflow.labels" . | nindent 4 }}
    app: booking-service
    app.kubernetes.io/component: business
spec:
  replicas: {{ .Values.bookingService.replicaCount }}
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
        app.kubernetes.io/component: business
        {{- include "pizzaflow.selectorLabels" . | nindent 8 }}
      annotations:
        {{- include "pizzaflow.prometheusAnnotations" (dict "port" .Values.bookingService.service.port) | nindent 8 }}
    spec:
      {{- include "pizzaflow.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: booking-service
          image: "{{ .Values.global.imageRegistry }}{{ .Values.bookingService.image.repository }}:{{ default .Values.bookingService.image.tag .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.bookingService.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.bookingService.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "pizzaflow.fullname" . }}-common-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/pizzaflow_bookings"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: postgres-password
          resources:
            {{- toYaml .Values.bookingService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.bookingService.service.port }}
            initialDelaySeconds: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.bookingService.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pizzaflow.fullname" . }}-booking-service
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "pizzaflow.labels" . | nindent 4 }}
    app: booking-service
spec:
  type: {{ .Values.bookingService.service.type }}
  ports:
    - port: {{ .Values.bookingService.service.port }}
      targetPort: {{ .Values.bookingService.service.port }}
      protocol: TCP
      name: http
  selector:
    app: booking-service
{{- end }}
