apiVersion: v2
name: pizzaflow
description: A Helm chart for PizzaFlow microservices platform
type: application
version: 0.1.0
appVersion: "1.0.0"

keywords:
  - microservices
  - spring-boot
  - pizza
  - restaurant

home: https://github.com/pizzaflow/pizza-flow

maintainers:
  - name: PizzaFlow Team
    email: team@pizzaflow.com

dependencies:
  - name: postgresql
    version: "14.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: mongodb
    version: "14.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: mongodb.enabled
  - name: redis
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled
  - name: kafka
    version: "26.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: kafka.enabled
  - name: keycloak
    version: "18.x.x"
    repository: https://charts.bitnami.com/bitnami
    condition: keycloak.enabled
