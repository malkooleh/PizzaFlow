# IMPORTANT: This file is a template only. All values marked REPLACE_WITH_SECURE_VALUE
# MUST be replaced with real secrets before applying to any cluster.
# For local dev use infrastructure/docker/.env (see .env.example).
# For staging/production use a dedicated secret manager (e.g., AWS Secrets Manager,
# HashiCorp Vault, or Sealed Secrets) and never commit real credentials here.
apiVersion: v1
kind: Secret
metadata:
  name: pizzaflow-db-credentials
  namespace: pizzaflow
  labels:
    app.kubernetes.io/part-of: pizzaflow-ecosystem
type: Opaque
stringData:
  # PostgreSQL
  POSTGRES_USER: "REPLACE_WITH_SECURE_VALUE"
  POSTGRES_PASSWORD: "REPLACE_WITH_SECURE_VALUE"
  SPRING_DATASOURCE_USERNAME: "REPLACE_WITH_SECURE_VALUE"
  SPRING_DATASOURCE_PASSWORD: "REPLACE_WITH_SECURE_VALUE"

  # MongoDB
  MONGO_INITDB_ROOT_USERNAME: "REPLACE_WITH_SECURE_VALUE"
  MONGO_INITDB_ROOT_PASSWORD: "REPLACE_WITH_SECURE_VALUE"

  # Redis (if authentication enabled)
  REDIS_PASSWORD: "REPLACE_WITH_SECURE_VALUE"
---
apiVersion: v1
kind: Secret
metadata:
  name: pizzaflow-keycloak-credentials
  namespace: pizzaflow
  labels:
    app.kubernetes.io/part-of: pizzaflow-ecosystem
type: Opaque
stringData:
  KEYCLOAK_ADMIN: "REPLACE_WITH_SECURE_VALUE"
  KEYCLOAK_ADMIN_PASSWORD: "REPLACE_WITH_SECURE_VALUE"
---
apiVersion: v1
kind: Secret
metadata:
  name: pizzaflow-mail-credentials
  namespace: pizzaflow
  labels:
    app.kubernetes.io/part-of: pizzaflow-ecosystem
type: Opaque
stringData:
  MAIL_USERNAME: "REPLACE_WITH_SECURE_VALUE"
  MAIL_PASSWORD: "REPLACE_WITH_SECURE_VALUE"
