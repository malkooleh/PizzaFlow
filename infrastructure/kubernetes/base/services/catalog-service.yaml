apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: pizzaflow
  labels:
    app: catalog-service
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/component: business
    app.kubernetes.io/part-of: pizzaflow-ecosystem
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: catalog-service
          image: pizzaflow/catalog-service:sha-0000000
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: pizzaflow-common-config
            - secretRef:
                name: pizzaflow-db-credentials
          env:
            - name: SPRING_DATA_MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: pizzaflow-db-credentials
                  key: MONGO_URI
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: pizzaflow
  labels:
    app: catalog-service
spec:
  type: ClusterIP
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
      name: http
  selector:
    app: catalog-service
