apiVersion: apps/v1
kind: Deployment
metadata:
  name: kitchen-service
  namespace: pizzaflow
  labels:
    app: kitchen-service
    app.kubernetes.io/name: kitchen-service
    app.kubernetes.io/component: business
    app.kubernetes.io/part-of: pizzaflow-ecosystem
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kitchen-service
  template:
    metadata:
      labels:
        app: kitchen-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: kitchen-service
          image: pizzaflow/kitchen-service:sha-0000000
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8084
          envFrom:
            - configMapRef:
                name: pizzaflow-common-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 90
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kitchen-service
  namespace: pizzaflow
  labels:
    app: kitchen-service
spec:
  type: ClusterIP
  ports:
    - port: 8084
      targetPort: 8084
      protocol: TCP
      name: http
  selector:
    app: kitchen-service
