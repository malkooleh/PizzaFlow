apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pizzaflow

resources:
  # Namespace
  - namespace.yaml
  
  # ConfigMaps and Secrets
  - configmaps/common-config.yaml
  - secrets/credentials.yaml
  
  # Infrastructure
  - infrastructure/postgres.yaml
  - infrastructure/mongodb.yaml
  - infrastructure/redis.yaml
  - infrastructure/zookeeper.yaml
  - infrastructure/kafka.yaml
  - infrastructure/keycloak.yaml
  
  # Platform Services
  - services/discovery-service.yaml
  - services/config-service.yaml
  - services/api-gateway.yaml
  
  # Business Services
  - services/catalog-service.yaml
  - services/order-service.yaml
  - services/payment-service.yaml
  - services/kitchen-service.yaml
  - services/inventory-service.yaml
  - services/booking-service.yaml
  - services/delivery-service.yaml
  - services/notification-service.yaml

commonLabels:
  app.kubernetes.io/managed-by: kustomize
  app.kubernetes.io/part-of: pizzaflow-ecosystem

images:
  - name: pizzaflow/discovery-service
    newTag: latest
  - name: pizzaflow/config-service
    newTag: latest
  - name: pizzaflow/api-gateway
    newTag: latest
  - name: pizzaflow/catalog-service
    newTag: latest
  - name: pizzaflow/order-service
    newTag: latest
  - name: pizzaflow/payment-service
    newTag: latest
  - name: pizzaflow/kitchen-service
    newTag: latest
  - name: pizzaflow/inventory-service
    newTag: latest
  - name: pizzaflow/booking-service
    newTag: latest
  - name: pizzaflow/delivery-service
    newTag: latest
  - name: pizzaflow/notification-service
    newTag: latest
