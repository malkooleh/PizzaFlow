# Pod Disruption Budgets for high availability
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: pizzaflow-prod
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: api-gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: discovery-service-pdb
  namespace: pizzaflow-prod
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: discovery-service
