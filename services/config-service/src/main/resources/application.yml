spring:
  application:
    name: config-service
  
  cloud:
    config:
      server:
        git:
          uri: https://github.com/malkooleh/pizzaflow-config
          default-label: main
          clone-on-start: true
          timeout: 5
          # For local development, use native profile with file system
        native:
          search-locations: classpath:/config,file:./config-repo
  
  profiles:
    active: native  # Use 'git' for production

server:
  port: 8888

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,refresh
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    org.springframework.cloud.config: DEBUG
