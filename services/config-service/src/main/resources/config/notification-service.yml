# Notification Service Configuration
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pizzaflow_notifications
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:noreply@pizzaflow.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

notification:
  channels:
    email:
      enabled: true
      from-address: noreply@pizzaflow.com
      from-name: PizzaFlow
    sms:
      enabled: false
    push:
      enabled: false
    in-app:
      enabled: true
  retry:
    max-attempts: 3
    delay-ms: 1000
