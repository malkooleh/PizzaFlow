<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Payment Receipt</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background: #27ae60; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; background: #f9f9f9; }
        .footer { padding: 20px; text-align: center; font-size: 12px; color: #666; }
        .receipt-box { background: white; border: 1px solid #ddd; padding: 20px; margin: 20px 0; }
        .amount { font-size: 24px; color: #27ae60; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🍕 PizzaFlow</h1>
        </div>
        <div class="content">
            <h2>Payment Successful! ✓</h2>
            <p>Your payment has been processed successfully.</p>
            
            <div class="receipt-box">
                <p><strong>Transaction Reference:</strong><br><span th:text="${transactionRef}">TXN-123456</span></p>
                <p><strong>Amount Paid:</strong></p>
                <p class="amount" th:text="${amount}">$25.99</p>
            </div>
            
            <p>A receipt has been stored in your account for your records.</p>
        </div>
        <div class="footer">
            <p>This is an automated receipt from PizzaFlow.</p>
            <p>&copy; 2024 PizzaFlow. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
