server:
  port: 8087

spring:
  application:
    name: delivery-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/pizzaflow_delivery
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: delivery-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Delivery-specific configuration
delivery:
  # Maximum delivery radius in kilometers
  max-delivery-radius-km: 15
  # Estimated minutes per kilometer
  minutes-per-km: 3
  # Base preparation time before pickup
  base-preparation-minutes: 20
  # Location update frequency in seconds
  location-update-interval-seconds: 10
  # Auto-assign courier to new orders
  auto-assign-enabled: true
  # Maximum concurrent deliveries per courier
  max-deliveries-per-courier: 3

logging:
  level:
    com.pizzaflow: DEBUG
    org.springframework.kafka: INFO
